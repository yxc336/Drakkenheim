<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>德拉肯海姆 NPC 档案录</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=EB+Garamond:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <!-- FreeImage.host 图床插件 -->
    <script async src="https://freeimage.host/sdk/pup.js" data-url="https://freeimage.host/upload" data-auto-insert="direct-links"></script>
    <style>
        :root {
            --drakken-purple: #2a0a3b;
            --drakken-glow: #9d4edd;
            --drakken-green: #39FF14;
            --drakken-red: #ff3333;
            --bg-dark: #0a0a0a;
            --border-gold: #c0a060;
            --text-gray: #d4d4d4;
        }

        /* 动画关键帧 */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulseGlow { 0% { text-shadow: 0 0 5px var(--drakken-glow); } 50% { text-shadow: 0 0 15px var(--drakken-glow), 0 0 5px #fff; } 100% { text-shadow: 0 0 5px var(--drakken-glow); } }
        @keyframes floatUp { 0% { transform: scale(0.95); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes statusPulse { 0% { opacity: 0.7; } 50% { opacity: 1; text-shadow: 0 0 8px var(--drakken-green); } 100% { opacity: 0.7; } }
        
        @keyframes urgentPulse {
            0% { transform: scale(1); box-shadow: 0 0 10px #ff0000; }
            50% { transform: scale(1.05); box-shadow: 0 0 25px #ff0000, 0 0 10px var(--drakken-red); }
            100% { transform: scale(1); box-shadow: 0 0 10px #ff0000; }
        }

        /* 全局盒模型修正 */
        * { box-sizing: border-box; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-gray);
            font-family: 'EB Garamond', serif;
            margin: 0; padding: 0 20px 40px 20px;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            animation: fadeIn 0.8s ease-out;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://i.ibb.co/Qvp3QHdQ/image.webp');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            opacity: 0.25; 
            z-index: -1;
        }

        h1 {
            font-family: 'Cinzel', serif;
            color: var(--border-gold);
            letter-spacing: 5px;
            text-shadow: 0 0 15px rgba(192, 160, 96, 0.4);
            margin: 20px 0 10px 0;
            animation: pulseGlow 4s infinite ease-in-out;
        }

        /* 派系面板 */
        .faction-info {
            width: 100%; max-width: 1100px;
            background: rgba(42, 10, 59, 0.6); 
            border: 1px solid rgba(192, 160, 96, 0.3);
            margin-bottom: 20px; padding: 15px;
            font-size: 0.9em; border-radius: 4px;
            backdrop-filter: blur(2px);
        }
        .faction-info summary { font-family: 'Cinzel', serif; color: var(--border-gold); cursor: pointer; outline: none; list-style: none; text-align: center; }
        .faction-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 15px; }
        .faction-item b { color: var(--drakken-glow); display: block; margin-bottom: 5px; }

        /* --- 悬浮控制面板 --- */
        .sticky-header {
            position: sticky;
            top: 0;
            z-index: 1000;
            width: 100%;
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(10px);
            padding: 15px 10px 5px 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(192, 160, 96, 0.3);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #status { font-size: 0.8em; color: var(--drakken-glow); margin-bottom: 12px; height: 1.2em; text-shadow: 1px 1px 2px #000; animation: statusPulse 2s infinite; }

        .controls { 
            display: flex; 
            gap: 12px; 
            flex-wrap: wrap; 
            justify-content: center; 
            align-items: center; 
            margin-bottom: 10px;
        }

        .filter-container { margin-bottom: 10px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
        /* --- 悬浮面板结束 --- */

        .filter-btn {
            background: rgba(26, 26, 26, 0.8); color: #aaa; border: 1px solid #444;
            padding: 5px 12px; font-family: 'Cinzel', serif; font-size: 0.75em;
            cursor: pointer; transition: 0.3s;
        }
        .filter-btn:hover, .filter-btn.active { 
            border-color: var(--drakken-green); color: var(--drakken-green); 
            box-shadow: 0 0 8px rgba(57, 255, 20, 0.2); transform: translateY(-2px);
        }

        .btn {
            background: rgba(10, 10, 10, 0.6); color: var(--border-gold); border: 1px solid var(--border-gold);
            padding: 8px 18px; cursor: pointer; font-family: 'Cinzel', serif; font-size: 0.85em;
            transition: all 0.3s; box-shadow: 0 0 5px rgba(0,0,0,0.5);
            height: 36px; display: inline-flex; align-items: center; justify-content: center;
        }
        .btn:hover { background: var(--border-gold); color: #000; transform: scale(1.05); box-shadow: 0 0 15px var(--border-gold); }
        
        .btn-sync { border-color: var(--drakken-green); color: var(--drakken-green); }
        .btn-sync:hover { background: var(--drakken-green); color: #000; box-shadow: 0 0 15px var(--drakken-green); }
        
        .btn-unsaved {
            background: rgba(42, 0, 0, 0.8) !important;
            border-color: var(--drakken-red) !important;
            color: var(--drakken-red) !important;
            animation: urgentPulse 2s infinite ease-in-out !important;
        }

        .admin-controls { display: none; gap: 12px; align-items: center; }
        body.editing-active .admin-controls { display: flex; flex-wrap: wrap; justify-content: center; }
        
        .separator { width: 1px; height: 25px; background: rgba(255,255,255,0.2); margin: 0 5px; }

        .btn-toggle-edit { border-color: #555; color: #777; }
        body.editing-active .btn-toggle-edit { border-color: var(--drakken-glow); color: var(--drakken-glow); }

        /* 表格样式 */
        .table-container {
            width: 100%; max-width: 1100px;
            background: rgba(10, 10, 10, 0.85); 
            border: 1px solid var(--border-gold);
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        table { width: 100%; border-collapse: collapse; }
        thead { background: var(--drakken-purple); font-family: 'Cinzel', serif; font-size: 0.9em; position: sticky; top: 110px; z-index: 10; }
        th { padding: 12px; color: #fff; text-align: left; border-bottom: 2px solid var(--border-gold); }
        
        tr { animation: fadeIn 0.4s ease-out forwards; }
        td { padding: 12px; border-bottom: 1px solid rgba(192, 160, 96, 0.2); font-size: 0.95em; color: var(--text-gray); }
        .name-cell { font-family: 'Cinzel', serif; color: #fff !important; font-weight: bold; }
        .role-cell { color: var(--drakken-glow) !important; font-style: italic; }
        .goal-cell { color: var(--drakken-green) !important; }

        body.editing-active [contenteditable="true"]:focus { outline: none; border-bottom: 1px solid var(--drakken-green); background: rgba(255,255,255,0.05); }

        .action-col { display: none; }
        body.editing-active .action-col { display: table-cell; }

        .portrait-cell img {
            width: 55px; height: 55px; object-fit: cover;
            border: 2px solid var(--drakken-glow); cursor: zoom-in;
            background: #000; transition: transform 0.3s;
        }
        .portrait-cell img:hover { transform: scale(1.2); z-index: 20; position: relative; }

        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; width: 80px; }
        .action-btn {
            background: rgba(10, 10, 10, 0.6); border: 1px solid var(--border-gold); color: var(--border-gold);
            height: 24px; font-size: 11px; cursor: pointer; display: flex; justify-content: center; align-items: center;
        }
        .action-btn:hover { background: var(--border-gold); color: #000; }
        .btn-danger:hover { background: var(--drakken-red); color: #fff; border-color: var(--drakken-red); }

        /* 模态框 */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 2000; justify-content: center; align-items: center;
            backdrop-filter: blur(5px);
        }
        #zoomModal img { max-width: 80%; max-height: 80%; border: 3px solid var(--border-gold); }
        
        .upload-panel { background: var(--bg-dark); border: 2px solid var(--border-gold); padding: 30px; width: 400px; text-align: center; }
        .url-input { width: 100%; padding: 8px; background: #111; border: 1px solid #444; color: #fff; margin-bottom: 15px; }

        .hidden-row { display: none; }

        /* 名词记录弹窗专有样式 */
        .noun-panel { width: 600px; max-width: 90vw; }
        .noun-textarea {
            width: 100%; height: 350px; background: #111; color: var(--text-gray);
            border: 1px solid var(--border-gold); padding: 12px; font-family: 'EB Garamond', serif;
            font-size: 1.1em; line-height: 1.5; resize: none; margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <h1>Drakkenheim NPC Registry</h1>
    
    <details class="faction-info">
        <summary>点击查看五大派系目标速查</summary>
        <div class="faction-grid">
            <div class="faction-item"><b>白银骑士团</b>打击非法施法者与天火信众，净化污染水晶。</div>
            <div class="faction-item"><b>覆影明灯</b>军队演变的救国组织，立志收复德拉肯海姆。</div>
            <div class="faction-item"><b>紫晶学院</b>研究异变，收回失落的魔法资料与秘法。</div>
            <div class="faction-item"><b>天火信众</b>崇尚陨石为圣物，认为融入黑暗才有光明。</div>
            <div class="faction-item"><b>女王和他的兄弟们</b>盗匪集团，希望维持混乱以从中获利。</div>
        </div>
    </details>

    <!-- 悬浮控制栏 -->
    <div class="sticky-header">
        <div id="status">感知到异质能量的流动...</div>

        <div class="controls">
            <button class="btn btn-toggle-edit" onclick="toggleEditMode()" id="editToggleBtn">✎ 编辑模式</button>
            <button class="btn" onclick="loadFromCloud()">↻ 拉取档案</button>
            <button class="btn" onclick="exportJSON()">⬇ 导出备份</button>

            <div class="admin-controls">
                <div class="separator"></div>
                <button class="btn" onclick="openNounModal()">📖 名词记录</button>
                <button class="btn" onclick="addNewRow()">+ 新增 NPC</button>
                <button class="btn btn-sync" id="save-btn" onclick="saveToCloud()">● 档案保存</button>
                <button class="btn" onclick="document.getElementById('importFile').click()">⬆ 导入覆盖</button>
            </div>
        </div>

        <div class="filter-container">
            <button class="filter-btn active" onclick="filterByRole('全部')">全部显示</button>
            <button class="filter-btn" onclick="filterByRole('白银骑士团')">白银骑士团</button>
            <button class="filter-btn" onclick="filterByRole('覆影明灯')">覆影明灯</button>
            <button class="filter-btn" onclick="filterByRole('紫晶学院')">紫晶学院</button>
            <button class="filter-btn" onclick="filterByRole('天火信众')">天火信众</button>
            <button class="filter-btn" onclick="filterByRole('女王和他的兄弟们')">女王和他的兄弟们</button>
            <button class="filter-btn" onclick="filterByRole('妄质生骸')">妄质生骸</button>
        </div>
    </div>

    <input type="file" id="importFile" style="display:none" accept=".json" onchange="importJSON(this)">

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th width="70">立绘</th>
                    <th width="140">姓名</th>
                    <th width="160">职位/派系</th>
                    <th width="200">目标/动机</th>
                    <th>备注</th>
                    <th width="100" class="action-col">操作</th>
                </tr>
            </thead>
            <tbody id="npcBody"></tbody>
        </table>
    </div>
    <div id="bottom-anchor"></div>

    <!-- 缩放模态框 -->
    <div id="zoomModal" class="modal-overlay" onclick="this.style.display='none'">
        <img id="modalImg" src="">
    </div>

    <!-- 精简后的换图模态框 -->
    <div id="uploadModal" class="modal-overlay">
        <div class="upload-panel">
            <h3 style="font-family:'Cinzel',serif; color:var(--border-gold); margin-top:0;">镜像幻影上传</h3>
            <div style="margin-bottom: 15px;">
                <button type="button" class="btn" data-chevereto-pup-trigger data-target="#urlInput">FreeImage 上传</button>
            </div>
            <input type="text" id="urlInput" class="url-input" placeholder="等待插件回填直链，或手动粘贴图片链接...">
            <div style="display:flex; justify-content: center; gap:10px;">
                <button class="btn" onclick="submitUrl()">确定</button>
                <button class="btn" style="border-color:#555; color:#777;" onclick="closeUploadModal()">取消</button>
            </div>
        </div>
    </div>

    <!-- 名词记录模态框 -->
    <div id="nounModal" class="modal-overlay">
        <div class="upload-panel noun-panel">
            <h3 style="font-family:'Cinzel',serif; color:var(--border-gold); margin-top:0;">团内名词记录</h3>
            <textarea id="nounTextarea" class="noun-textarea" placeholder="在此记录特有名词、黑话、或者世界观设定..."></textarea>
            <div style="display:flex; justify-content: center; gap:10px;">
                <button class="btn" onclick="saveNounRecords()">确定</button>
                <button class="btn" style="border-color:#555; color:#777;" onclick="closeNounModal()">关闭</button>
            </div>
        </div>
    </div>

    <script>
        const BIN_ID = '694660dc43b1c97be9fabafa';
        const API_KEY = '$2a$10$XJ53rCMwsJ3xbBWXWROPieHdZvZnbtvrR8h61khdWQlaC.WvqXbC2';
        const ACCESS_PASSWORD = '781674';

        let npcData = [];
        let nounRecords = "";
        let isEditMode = false;
        let hasUnsavedChanges = false;
        let currentEditingIndex = -1;

        window.onload = function() {
            loadFromCloud();
            initUrlAutoCapture();
        };

        // 仅保留 contenteditable 纯文本过滤
        document.addEventListener('paste', function(e) {
            if (e.target.getAttribute('contenteditable')) {
                e.preventDefault();
                const text = (e.originalEvent || e).clipboardData.getData('text/plain');
                document.execCommand('insertText', false, text);
            }
        });

        window.onbeforeunload = function(e) {
            if (hasUnsavedChanges) return '有未保存的更改，确定要离开吗？';
        };

        function setUnsavedState(isDirty) {
            hasUnsavedChanges = isDirty;
            const saveBtn = document.getElementById('save-btn');
            if (isDirty) {
                saveBtn.classList.add('btn-unsaved');
                saveBtn.innerHTML = "⚠ 变更未保存";
                document.title = "* 未保存 - NPC 档案";
            } else {
                saveBtn.classList.remove('btn-unsaved');
                saveBtn.innerHTML = "● 档案保存";
                document.title = "德拉肯海姆 NPC 档案录";
            }
        }

        function toggleEditMode() {
            if (!isEditMode) {
                if (prompt("请输入 DM 密语:") === ACCESS_PASSWORD) {
                    isEditMode = true;
                    document.body.classList.add('editing-active');
                    document.getElementById('editToggleBtn').innerHTML = "👁 观察模式";
                }
            } else {
                isEditMode = false;
                document.body.classList.remove('editing-active');
                document.getElementById('editToggleBtn').innerHTML = "✎ 编辑模式";
            }
            renderTable();
        }

        async function loadFromCloud() {
            showStatus("正在从暗影界提取档案...");
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY, 'X-Bin-Meta': false }
                });
                const data = await res.json();
                
                if (data.npcs) {
                    npcData = data.npcs;
                    nounRecords = data.nouns || "";
                } else {
                    npcData = data;
                    nounRecords = "";
                }
                
                renderTable();
                setUnsavedState(false);
                showStatus("档案已同步。");
            } catch (err) { showStatus("同步失败。"); }
        }

        async function saveToCloud() {
            if (prompt("确认刻入圣物吗？(输入密语):") !== ACCESS_PASSWORD) return;
            showStatus("正在写入...");
            
            const payload = {
                npcs: npcData,
                nouns: nounRecords
            };

            try {
                await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                    body: JSON.stringify(payload)
                });
                setUnsavedState(false);
                showStatus("时间线已稳固。");
            } catch (err) { showStatus("保存失败。"); }
        }

        function renderTable() {
            const tbody = document.getElementById("npcBody");
            tbody.innerHTML = '';
            const editableAttr = isEditMode ? 'contenteditable="true"' : '';

            npcData.forEach((item, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="portrait-cell"><img src="${item.img}" onerror="this.src='https://via.placeholder.com/55?text=?'" onclick="zoomImg(this.src)"></td>
                    <td ${editableAttr} class="name-cell" onblur="updateData(${index}, 'name', this.innerText)">${item.name}</td>
                    <td ${editableAttr} class="role-cell" onblur="updateData(${index}, 'role', this.innerText)">${item.role}</td>
                    <td ${editableAttr} class="goal-cell" onblur="updateData(${index}, 'goal', this.innerText)">${item.goal}</td>
                    <td ${editableAttr} onblur="updateData(${index}, 'note', this.innerText)">${item.note}</td>
                    <td class="action-col">
                        <div class="action-grid">
                            <button class="action-btn" onclick="moveRow(${index}, -1)">▲</button>
                            <button class="action-btn" onclick="moveRow(${index}, 1)">▼</button>
                            <button class="action-btn" onclick="openUploadModal(${index})">换图</button>
                            <button class="action-btn btn-danger" onclick="deleteRow(${index})">☠</button>
                        </div>
                    </td>
                `;
                tbody.appendChild(row);
            });
            const activeBtn = document.querySelector('.filter-btn.active');
            if (activeBtn && activeBtn.innerText !== '全部显示') filterByRole(activeBtn.innerText);
        }

        function updateData(index, field, value) {
            if (npcData[index][field] !== value.trim()) {
                npcData[index][field] = value.trim();
                setUnsavedState(true);
            }
        }

        function addNewRow() {
            npcData.push({img: 'https://i.ibb.co/mFr8QwJm/image.png', name: '新角色', role: '职位', goal: '目标', note: ''});
            renderTable();
            setUnsavedState(true);
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        function deleteRow(index) {
            if(confirm("确定抹除吗？")) { npcData.splice(index, 1); renderTable(); setUnsavedState(true); }
        }

        function moveRow(index, direction) {
            const newIndex = index + direction;
            if (newIndex >= 0 && newIndex < npcData.length) {
                [npcData[index], npcData[newIndex]] = [npcData[newIndex], npcData[index]];
                renderTable();
                setUnsavedState(true);
            }
        }

        function openUploadModal(index) {
            currentEditingIndex = index;
            document.getElementById('urlInput').value = '';
            document.getElementById('uploadModal').style.display = 'flex';
        }

        function closeUploadModal() {
            document.getElementById('uploadModal').style.display = 'none';
        }

        // --- 直链清洗与闭环逻辑 ---
        function extractCleanImageUrl(rawText) {
            if (!rawText || typeof rawText !== 'string') return '';
            const text = rawText.trim();
            // 优先匹配带常见图片后缀的 HTTP/HTTPS 链接
            const imgMatch = text.match(/https?:\/\/[^\s"'<>\(\)]+?\.(?:jpg|jpeg|png|webp|gif)(?:\?[^\s"'<>\(\)]*)?/i);
            if (imgMatch) return imgMatch[0];
            // 若无后缀则提取纯标准 HTTP/HTTPS 链接
            const urlMatch = text.match(/https?:\/\/[^\s"'<>\(\)]+/i);
            if (urlMatch) return urlMatch[0];
            return '';
        }

        function applyCleanImageUrl(rawText) {
            const cleanUrl = extractCleanImageUrl(rawText);
            if (cleanUrl && currentEditingIndex >= 0 && currentEditingIndex < npcData.length) {
                npcData[currentEditingIndex].img = cleanUrl;
                renderTable();
                setUnsavedState(true);
                closeUploadModal();
                showStatus("立绘已更新。");
                return true;
            }
            return false;
        }

        function submitUrl() {
            const rawVal = document.getElementById('urlInput').value;
            const success = applyCleanImageUrl(rawVal);
            if (!success) {
                alert("未能提取到有效的图片直链，请检查输入格式。");
            }
        }

        function initUrlAutoCapture() {
            const inputEl = document.getElementById('urlInput');

            // 监听插件或用户直接将文本写入 input 框
            ['input', 'change'].forEach(eventType => {
                inputEl.addEventListener(eventType, function() {
                    if (this.value) {
                        applyCleanImageUrl(this.value);
                    }
                });
            });

            // 跨域监听 FreeImage / pup.js 回传的消息
            window.addEventListener('message', function(event) {
                let candidateText = '';
                if (typeof event.data === 'string') {
                    candidateText = event.data;
                } else if (event.data && typeof event.data === 'object') {
                    if (typeof event.data.message === 'string') {
                        candidateText = event.data.message;
                    } else {
                        try {
                            candidateText = JSON.stringify(event.data);
                        } catch (e) {}
                    }
                }

                if (candidateText) {
                    const cleanUrl = extractCleanImageUrl(candidateText);
                    if (cleanUrl) {
                        inputEl.value = cleanUrl;
                        applyCleanImageUrl(cleanUrl);
                    }
                }
            });
        }

        // 名词记录弹窗逻辑
        function openNounModal() {
            document.getElementById('nounTextarea').value = nounRecords;
            document.getElementById('nounModal').style.display = 'flex';
        }
        function closeNounModal() {
            document.getElementById('nounModal').style.display = 'none';
        }
        function saveNounRecords() {
            const newValue = document.getElementById('nounTextarea').value;
            if (nounRecords !== newValue) {
                nounRecords = newValue;
                setUnsavedState(true);
            }
            closeNounModal();
        }

        function zoomImg(src) {
            document.getElementById('modalImg').src = src;
            document.getElementById('zoomModal').style.display = 'flex';
        }

        function filterByRole(faction) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.toggle('active', btn.innerText === faction));
            const rows = document.querySelectorAll("#npcBody tr");
            rows.forEach(row => {
                const roleText = row.cells[2].innerText;
                row.classList.toggle('hidden-row', faction !== '全部' && faction !== '全部显示' && !roleText.includes(faction));
            });
        }

        function exportJSON() {
            const payload = { npcs: npcData, nouns: nounRecords };
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(payload, null, 2));
            const a = document.createElement('a');
            a.href = dataStr;
            a.download = `Drakkenheim_${new Date().toISOString().split('T')[0]}.json`;
            a.click();
        }

        function importJSON(input) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.npcs) {
                        npcData = data.npcs;
                        nounRecords = data.nouns || "";
                    } else {
                        npcData = data;
                        nounRecords = "";
                    }
                    renderTable(); setUnsavedState(true); showStatus("备份已导入。");
                } catch (err) { alert("格式错误"); }
            };
            reader.readAsText(input.files[0]);
        }

        function showStatus(msg) { document.getElementById("status").innerText = msg; }
    </script>
</body>
</html>
